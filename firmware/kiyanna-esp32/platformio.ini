[env:kiyanna-esp32s3]
; pioarduino = Arduino-ESP32 v3.x + ESP-IDF 5.3 for PlatformIO.
; Required for MCLK output on GPIO16 (SOC_I2S_SUPPORTS_MCLK_OUTPUT) — the
; official espressif32 platform ships Arduino-ESP32 v2.0.17 which does NOT
; output MCLK on ESP32-S3, causing the ES8311 ADC to produce silence.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
src_dir = src

; MUMA ESP32-S3 N16R8 — 16MB Flash + 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 524288
board_build.arduino.memory_type = qio_opi

; Upload via USB Serial (CDC) — auto-detect port
upload_speed = 921600

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM

lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  adafruit/Adafruit GFX Library @ ^1.11.10
  bblanchon/ArduinoJson @ ^7.0.0
